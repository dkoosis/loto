version: 3
workdir: .

exclude:
  - .sandbox
  - bin
  - docs
  # bugclasses pack (ccp-sbp): ruleguard DSL, not part of the layered graph.
  - .golangci-rules

excludeFiles:
  # tools.go pins the ruleguard DSL into the module graph (build tag `tools`);
  # it is not a layered component.
  - "tools.go"

# Layering invariants for loto v2:
#   cmd/loto → internal/cli (only)
#   internal/cli → {domain, store, identity, render}
#   internal/render → {domain, store, identity}
#   internal/store → internal/domain
#   internal/identity → ∅
#   internal/domain → ∅ (pure functions, no internal deps)
#
# Keep simple. Fail fast on back-edges (e.g., domain importing store).

allow:
  depOnAnyVendor: true

components:
  main:
    in: cmd/loto/**
  cli:
    in: internal/cli/**
  store:
    in: internal/store/**
  identity:
    in: internal/identity/**
  domain:
    in: internal/domain/**
  render:
    in: internal/render/**
  lane:
    in: internal/lane/**
  mail:
    in: internal/mail/**

deps:
  main:
    mayDependOn:
      - cli
  cli:
    mayDependOn:
      - domain
      - store
      - identity
      - render
      - lane
      - mail
  # internal/mail is the host-global mailbox — sqlite over domain.Message only.
  mail:
    mayDependOn:
      - domain
  # internal/lane is pure git plumbing — stdlib only, no internal deps.
  # anyVendorDeps (not an empty mayDependOn) is how go-arch-lint v3 wants a
  # no-internal-deps component declared — same as domain/identity below. It
  # still forbids every internal component edge (no mayDependOn ref present).
  lane:
    anyVendorDeps: true
  render:
    mayDependOn:
      - domain
      - store
      - identity
  store:
    mayDependOn:
      - domain
  identity:
    anyVendorDeps: true
  domain:
    anyVendorDeps: true
