version: 3
workdir: .

exclude:
  - .sandbox
  - bin
  - docs
  # bugclasses pack (ccp-sbp): ruleguard DSL, not part of the layered graph.
  - .golangci-rules

excludeFiles:
  # tools.go pins the ruleguard DSL into the module graph (build tag `tools`);
  # it is not a layered component.
  - "tools.go"

# Layering invariants for loto v2:
#   cmd/loto → internal/cli (only)
#   internal/cli → {domain, store, identity, render}
#   internal/render → {domain, store, identity}
#   internal/store → internal/domain
#   internal/identity → ∅
#   internal/domain → ∅ (pure functions, no internal deps)
#   internal/gate → {domain, lane} (loto-ovno; NOT store — an envelope is a
#     pure function of git object state + caller-supplied data, never a
#     store lookup, so this edge is a design invariant, not an oversight)
#
# Keep simple. Fail fast on back-edges (e.g., domain importing store).

allow:
  depOnAnyVendor: true

components:
  main:
    in: cmd/loto/**
  cli:
    in: internal/cli/**
  store:
    in: internal/store/**
  identity:
    in: internal/identity/**
  domain:
    in: internal/domain/**
  render:
    in: internal/render/**
  lane:
    in: internal/lane/**
  gate:
    in: internal/gate/**

deps:
  main:
    mayDependOn:
      - cli
  cli:
    mayDependOn:
      - domain
      - store
      - identity
      - render
      - lane
  # internal/lane is pure git plumbing — stdlib only, no internal deps.
  # anyVendorDeps (not an empty mayDependOn) is how go-arch-lint v3 wants a
  # no-internal-deps component declared — same as domain/identity below. It
  # still forbids every internal component edge (no mayDependOn ref present).
  lane:
    anyVendorDeps: true
  # internal/gate is the git-gate envelope layer (loto-ovno). It reads git
  # object state directly and internal/lane's WriteSet shape for the
  # deletion round-trip test — deliberately NOT store: an envelope is a pure
  # function of git state + caller data, never a store lookup (design.md
  # under this package's own doc comment).
  gate:
    mayDependOn:
      - domain
      - lane
  render:
    mayDependOn:
      - domain
      - store
      - identity
  # store → gate (loto-ovno.4, not loto-ovno.3's own edge): admission's
  # accept-side actions (write the envelope + proposal refs, convert a lease to
  # a durable candidate claim) genuinely need both persistence AND git-ref
  # plumbing in one place. gate ITSELF still imports nothing from store — this
  # edge runs one direction only, and Admit()/Capture() stay exactly as
  # store-independent as the comment above them says.
  store:
    mayDependOn:
      - domain
      - gate
  identity:
    anyVendorDeps: true
  domain:
    anyVendorDeps: true
