version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  # bugclasses baseline floor (ccp-sbp.2, decision nug d7ea466a8172): keep
  # golangci's own defaults (errcheck, govet, ineffassign, staticcheck, unused)
  # under loto's richer list, so the floor is never below the shared minimum.
  default: standard

  enable:
    # Error handling
    - err113
    - errchkjson
    - errorlint
    - nilerr
    - nilnesserr

    # Safety
    - bodyclose
    - containedctx
    - forbidigo
    - forcetypeassert
    - gosec
    - noctx
    - predeclared
    - rowserrcheck
    - sqlclosecheck

    # Complexity
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - nestif

    # Enum & type safety
    - exhaustive
    - makezero
    - musttag
    - reassign

    # Style & correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - grouper
    - inamedparam
    - intrange
    - iotamixing
    - loggercheck
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - recvcheck
    - revive
    - sloglint
    - staticcheck # baseline floor: a golangci default, named so the floor is explicit
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - wastedassign

    # Performance
    - mirror
    - perfsprint

    # Testing
    - testifylint
    - thelper
    - usetesting

  disable:
    - godox
    - wsl

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes. Rules live in .golangci-rules/bugclasses.go — a verbatim
      # copy of the upstream pack; drift-guarding moved into conform (sd-th5.15).
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off until loto moves durable state to atomicfile.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - appendCombine
        - commentFormatting
        - deprecatedComment
        - hugeParam
        - ifElseChain
        - unlambda
    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon code should
      # thread the caller/shutdown ctx (strand st-47z, trixi #606,
      # trixi-bot gg-8rq.3, canapay can-x38). loto is a short-lived CLI, so the
      # ban is scoped in exclusions below to the CLI command roots + git
      # plumbing where a fresh root context is the correct root; the ban still
      # covers the SQLite store, whose detached audit writes carry their own
      # //nolint audit trail. Types-aware so a `ctx.Background` field can't misfire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: bare-return
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
        - name: waitgroup-by-value
          disabled: false
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # syscall.Stat_t.Nlink is uint16 on darwin, uint32 on linux/arm64, and
      # uint64 on linux/amd64 — the uint64() conversion two platforms need
      # reads as identity on linux/amd64. A nolint can't work: nolintlint
      # flags it as unused on every platform where the conversion is real,
      # and unconvert's safe mode is a no-op under golangci (sd-th5.15).
      - linters:
          - unconvert
        path: internal/store/locks_acquire\.go
        text: unnecessary conversion
      # Test files: relax security, complexity, and context requirements
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: _test\.go
      - linters:
          - noctx
        path: _test\.go
      - linters:
          - unparam
        path: _test\.go
      # cmd main.go: relax complexity, allow cobra init()
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
          - gochecknoinits
        path: cmd/.*/main\.go
      - linters:
          - gocritic
        path: cmd/.*/main\.go
        text: exitAfterDefer
      # bugclasses rule 5 (forbidigo Background ban): loto is a short-lived CLI,
      # not a long-lived daemon (a `loto serve` daemon is only proposed —
      # loto-e6r). Every command invocation IS a root, so context.Background is
      # legitimate at the CLI command layer and its git plumbing. Scope the ban
      # out of those; it still covers internal/store, where the detached audit
      # writes each carry their own //nolint audit trail.
      - linters:
          - forbidigo
        path: '(_test\.go$|/cmd/|(^|/)main\.go$|internal/cli/|internal/lane/)'
        text: 'context\.Background'
    paths:
      - third_party$
      - examples$
      - \.claude/ # sub-agent worktree copies share the module path; ./... must not lint them

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - examples$
      - \.claude/ # sub-agent worktree copies share the module path; ./... must not lint them
